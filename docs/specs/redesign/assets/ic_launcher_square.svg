      <stop offset="0" stop-color="#0E1A36"/>
      <stop offset="1" stop-color="#03061A"/>
    </linearGradient>
    <radialGradient id="halo" cx="54" cy="32" r="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#22E6FF" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#22E6FF" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#22E6FF" stop-opacity="0"/>
