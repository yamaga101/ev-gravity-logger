  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#halo)"/>
  <g stroke="#22E6FF" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- E (left half, x=22-48, y=24-88): vertical stem + 3 horizontal bars -->
